project_id = "fin-app"

[api]
port = 54321
# "private" holds third-party API credentials (Up Bank tokens etc) — it must
# stay listed here for the service-role Edge Function client to reach it at
# all (PostgREST refuses an unrecognised schema outright, before any grant or
# RLS check even runs — verified: a service_role request with
# `Accept-Profile: private` 406s if this schema isn't listed). The actual
# security boundary is NOT this list; it's that `anon`/`authenticated` hold
# zero grants and zero USAGE on `private` — see
# 20260807000000_provider_connections.sql. Do not add a schema here that
# doesn't have that same grant discipline.
schemas = ["public", "graphql_public", "private"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "52428800"

[auth]
# Must match the Vite dev server port (app/vite.config.ts -> server.port = 5300).
# A mismatch here is silent: magic links and password-reset links are generated
# against site_url and simply land nowhere.
site_url = "http://localhost:5300"
additional_redirect_urls = [
  "http://localhost:5300",
  "http://127.0.0.1:5300",
  "http://localhost:5300/auth/callback",
  "http://127.0.0.1:5300/auth/callback",
  "http://localhost:5300/auth/reset",
  "http://127.0.0.1:5300/auth/reset",
]
# 15 minutes. Short access-token lifetime is what makes session revocation
# meaningful — a revoked session stops working within one expiry window
# rather than an hour later.
jwt_expiry = 900
enable_signup = true
# Rotation with reuse detection: replaying a already-used refresh token
# revokes the whole token family instead of minting a new session.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_confirmations = false  # local only; enable in hosted environments

# ── OAuth2 / OIDC providers ────────────────────────────────────────────
# Secrets come from supabase/.env.local locally and project secrets in prod.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
skip_nonce_check = false

[auth.external.github]
enabled = true
client_id = "env(GITHUB_OAUTH_CLIENT_ID)"
secret = "env(GITHUB_OAUTH_SECRET)"

